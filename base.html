<!DOCTYPE html>
<html lang="en">
    <head>
        <!--tells the browser exactly how to convert the website's binary code into readable text-->
        <meta charset="UTF-8">
        <!-- tells mobile browsers how to scale and adjust the website's width to fit properly on different screen sizes, preventing users from having to pinch and zoom to read the text-->
        <meta name="viewport" content="width=device-width,initial-scal=1.0">
        <!-- text shown on the browser tab and in search engine results-->
        <title>Document</title>
    </head>
    <body>
        <h1>Good Morning</h1>
        <p>welcome everyone i think this should be an engaging section</p>
    </body>
</html>
