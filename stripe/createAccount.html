<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width initial-sclaing=1.0">
        <title>Sing up and create a Stripe</title>
        <link rel="stylesheet" href="createAccount.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Pliant:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <img src="https://plus.unsplash.com/premium_photo-1681487767138-ddf2d67b35c1?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Z3JhcGhzfGVufDB8fDB8fHww" alt="background-image" class="image">
            <div class="overlay">
                <div class="main-heading">
                    Create your Stripe account
                </div>
                <form class="form">
                    <div class="first-field">
                       <label for="email">Email</label>
                       <br>
                       <input type="email" id="email" name="email" class="field type">
                    </div>
                    <div class="second-field">
                       <label for="name">Full name</label>
                       <br>
                       <input type="text" id="name" name="fullname" class="field type">
                    </div>
                    <div class="third-field">
                       <label for="Password">Password</label>
                       <br>
                       <input type="password" id="password" name="password" class="field type">
                    </div>
                    <div class="fourth-field">
                       <label for="country">Country</label>
                       <br>
                        <select id="country" class="field type option">
                            <option>Australia</option>
                            <option>Belgium</option>
                            <option>Brazil</option>
                            <option>Japan</option>
                            <option>India</option>
                            <option>italy</option>
                            <option>Hungary</option>
                        </select>
                    </div>
                    <div class="fifth-field">
                        <button type="submit" class="type create-account field">Create account</button>
                        <div class="orField">
                            <div class="line"></div>
                            <div>OR</div>
                            <div class="line"></div>
                        </div>
                        <button type="submit" class="type signup field"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.8824 7.41113H8.11768V9.72516H11.4231C11.3564 10.0945 11.2134 10.4465 11.0029 10.7595C10.7925 11.0726 10.5191 11.34 10.1995 11.5454V13.051H12.1665C12.7703 12.4802 13.2452 11.7912 13.5605 11.0286C14.0327 9.88636 14.0878 8.62111 13.8824 7.41113Z" fill="#4285F4"></path><path d="M8.11765 14.4996C9.76488 14.4996 11.1599 13.9718 12.1665 13.0506L10.1995 11.545C9.58012 11.9375 8.85452 12.1373 8.11765 12.1181C7.35471 12.1088 6.61379 11.8656 5.99848 11.4224C5.38317 10.9793 4.92424 10.3584 4.68585 9.64648H2.65015V11.1856C3.15915 12.1814 3.94 13.0187 4.9055 13.604C5.87099 14.1892 6.98311 14.4992 8.11765 14.4996Z" fill="#34A853"></path><path d="M4.68589 9.64706C4.42873 8.90009 4.42873 8.09081 4.68589 7.34384V5.79395H2.65019C2.22264 6.63065 2 7.55387 2 8.49004C2 9.42621 2.22264 10.3494 2.65019 11.1861L4.68589 9.64706Z" fill="#FBBC04"></path><path d="M8.11765 4.87211C8.98898 4.85751 9.83116 5.18027 10.4621 5.77064L12.2126 4.05185C11.5147 3.43218 10.6808 2.9789 9.77551 2.72723C8.87026 2.47556 7.91812 2.43227 6.99307 2.60073C6.06803 2.76919 5.19498 3.14487 4.44177 3.69857C3.68856 4.25226 3.07548 4.96907 2.65015 5.7933L4.68585 7.34371C4.92424 6.63182 5.38317 6.0109 5.99848 5.56776C6.61379 5.12461 7.35471 4.8814 8.11765 4.87211Z" fill="#EA4335"></path></svg><span>Sign up with Google</span></button>
                    </div>
                    <div class="sixth-field">
                       Already have an account?<a href="#">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
