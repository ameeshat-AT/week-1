<!DOCTYPE html>
<html lang="en">
<head>
    <meta chareset="utf-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Grid-sizing Methods</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <h2>Fixed Px</h2>
        <div class="first-grid">
        <div class="item1 item">1</div>
        <div class="item2 item">2</div>
        <div class="item3 item">3</div>
        <div class="item4 item">4</div>
        <div class="item5" item>5</div>
        <div class="item6" item>6</div>
    </div>
     <h2>percentage</h2>
    <div class="second-grid">
        <div class="item7 item">1</div>
        <div class="item8 item">2</div>
        <div class="item8 item">3</div>
        <div class="item9 item">4</div>
        <div class="item10 item">5</div>
        <div class="item11 item">6</div>
    </div>
    <h2>Fraction</h2>
    <div class="third-grid">
        <div class="item12 item">1</div>
        <div class="item13 item">2</div>
        <div class="item14 item">3</div>
        <div class="item15 item">4</div>
        <div class="item16 item">5</div>
        <div class="item17 item">6</div>
    </div>
    <h2>Using auto</h2>
    <div class="fourth-grid">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
    <h2>Using Repeat</h2>
    <div class="fifth-grid">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
     <h2>Using minmax</h2>
    <div class="minmax">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
     <h2>Using minmax and autofill</h2>
    <div class="autofill">
        <div class="item">1</div>
        <div class="item">2</div>
        <!-- <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div> -->
    </div>
    <h2>implicite-grid</h2>
    <div class="implicit">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
        <div class="item">11</div>
        <div class="item">12</div>
    </div>
</body>
</html>
