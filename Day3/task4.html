<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>Responsive-grid without media queries</title>
        <link rel="stylesheet" href="task4.css">
    </head>
    <body>
        <h1>respondive grid without media query</h1>
        <div class="grid-autofill">
            <div class="item1 item">1</div>
            <div class="item2 item">2</div>
            <div class="item3 item">3</div>
            <div class="item4 item">4</div>
            <div class="item5 item">5</div> 
            <div class="item6 item">6</div>
            <div class="item7 item">7</div>
            <div class="item8 item">8</div>
            <div class="item9 item">9</div>
            </div>
        <h1>Grid-Autofill</h1>
        <div class="grid-autofill">
            <div class="item1 item">1</div>
            <div class="item2 item">2</div>
            <div class="item3 item">3</div>
        </div>
        <h1>Grid-Autofit</h1>
        <div class="grid-autofit">
            <div class="item1 item">1</div>
            <div class="item2 item">2</div>
            <div class="item3 item">3</div>
        </div>
        <h1>Last item spanning</h1>
        <div class="responsive-grid">
                <div class="item1 item">1</div>
                <div class="featured item">2</div>
                <div class="item3 item">3</div>
                <div class="item4 item">4</div>
                <div class="item5 item">5</div> 
                <div class="item6 item">6</div>
                <div class="item7 item">7</div>
                <div class="ritem8 item">8</div>
        </div>
    </body>
</html>
