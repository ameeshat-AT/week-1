<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>Registration form</title>
        <script src="task5.js" defer></script>
        <link rel=stylesheet href="task5.css">
    </head>
    <body>
        <main>
            <h1>Registration Form</h1>
        <form id="form">
            <div class="form-details">
                <div class="input-field">
                    <label for="name">Name:</label>
                    <br>
                    <input type="text" id="name" name="Name">
                </div>
                <div class="input-field">
                    <label for="age">Age:</label>
                    <br>
                    <input type="number" id="age" name="Age">
                </div>
                <div class="input-field">
                    <label for="email">Emai-address:</label>
                    <br>
                    <input type="text" id="email" name="Email" >
                </div>
                <div class="input-field">
                    <label for="password">Password:</label>
                    <br>
                    <input type="password" id="password" name="Password" autocomplete="current-password">
                </div>
                <div class="input-field">
                    <label for="conformpassword">Confirm Password:</label>
                    <br>
                    <input type="password" id="confirmpassword" name="conformPassword" autocomplete="current-password">
                </div>
                <div class="input-field button">
                    <button type="submit">Submit</button>
                </div>
            </div>
        </form>
        </main>
    </body>
</html>
